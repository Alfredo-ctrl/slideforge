[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "slideforge"
version = "0.1.0"
description = "Slide decks built for AI agents. CLI, Python API and MCP server."
readme = "README.md"
license = {text = "MIT"}
authors = [{name = "Alfredo Ramos"}]
requires-python = ">=3.10"
dependencies = [
    "python-pptx>=1",
]

[project.scripts]
slideforge = "slideforge.cli:main"

[tool.setuptools.packages.find]
include = ["slideforge*"]
